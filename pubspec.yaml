name: sibenmo_mobile
description: Sistem Informasi Bengkel Motor
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # --- Lokal / offline fallback (sebelumnya) ---
  sqflite: ^2.3.0
  path: ^1.8.0
  intl: ^0.18.0
  flutter_slidable: ^3.0.0
  # --- Arsitektur baru: Flutter -> Laravel API -> MySQL (sesuai diagram) ---
  dio: ^5.4.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_sibenmo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo_sibenmo.png"
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/images/logo_sibenmo.png"
